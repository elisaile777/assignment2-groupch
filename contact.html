
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Us | T-Coude</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Imbue:wght@400;500;600;700&family=Josefin+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Main CSS -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    .contact-page {
      padding: 65px 0 80px;
      font-family: 'Josefin Sans', sans-serif;
    }

    .contact-title {
      font-family: 'Imbue', serif;
      color: #182B3D;
      font-size: 52px;
      text-align: center;
      margin-bottom: 40px;
    }

    .contact-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 55px;
      align-items: center;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .contact-info-item {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .contact-icon {
      width: 48px;
      height: 48px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .contact-info-item h3 {
      color: #182B3D;
      font-size: 21px;
      font-weight: 700;
      margin: 0 0 6px;
    }

    .contact-info-item p,
    .contact-info-item a {
      color: #3D2F18;
      font-size: 17px;
      margin: 0;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .contact-info-item a:hover {
      text-decoration: underline;
    }

    .contact-form {
      background: #FFF4D8;
      border: 2px solid #AD7032;
      padding: 32px;
      border-radius: 8px;
    }

    .contact-form h2 {
      font-family: 'Imbue', serif;
      color: #182B3D;
      font-size: 36px;
      margin-bottom: 22px;
    }

    .contact-form label {
      color: #182B3D;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .contact-form .form-control,
    .contact-form .form-select {
      border: 1px solid #AD7032;
      border-radius: 4px;
      padding: 11px;
      font-family: 'Josefin Sans', sans-serif;
      margin-bottom: 17px;
    }

    .contact-submit {
      background: #182B3D;
      color: #FFF4D8;
      border: none;
      padding: 12px 30px;
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 600;
      transition: 0.2s;
    }

    .contact-submit:hover {
      background: #AD7032;
      color: white;
    }

    .contact-toucan {
      width: 100%;
      max-width: 390px;
      height: 390px;
      object-fit: contain;
      display: block;
      margin: 35px auto 0;
    }

    @media (max-width: 767px) {
      .contact-page {
        padding: 40px 18px 55px;
      }

      .contact-title {
        font-size: 42px;
      }

      .contact-layout {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .contact-form {
        padding: 22px;
      }

      .contact-toucan {
        max-width: 280px;
        height: 280px;
      }

      .contact-icon {
        width: 42px;
        height: 42px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">

      <a class="navbar-brand" href="index.html">
        <img src="images/tcoude-logo.png" alt="T-Coude Logo" height="65">
      </a>

      <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse" data-bs-target="#mainNavbar"
        aria-controls="mainNavbar" aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="index.html#products">Shop</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="index.html#about">About Us</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="contact.html">Contact Us</a>
          </li>

        </ul>
      </div>

    </div>
  </nav>

  <!-- CONTACT SECTION -->
  <main class="contact-page">

    <div class="container">

      <h1 class="contact-title">GET IN TOUCH WITH US!</h1>

      <div class="contact-layout">

        <!-- CONTACT INFORMATION -->
        <section>

          <div class="contact-info">

            <!-- EMAIL -->
            <div class="contact-info-item">

              <img
                src="images/contact-email-blue.png"
                alt="Email icon"
                class="contact-icon"
              >

              <div>
                <h3>Email Us</h3>

                <a href="mailto:hello@examplewebsite142.com">
                  hello@examplewebsite142.com
                </a>
              </div>

            </div>

            <!-- ORDER INQUIRIES -->
            <div class="contact-info-item">

              <img
                src="images/contact-orders-blue.png"
                alt="Order inquiries icon"
                class="contact-icon"
              >

              <div>
                <h3>Order Inquiries</h3>

                <a href="mailto:orders@examplewebsite142.com">
                  orders@examplewebsite142.com
                </a>
              </div>

            </div>

            <!-- TIKTOK -->
            <div class="contact-info-item">

              <img
                src="images/contact-tiktok-blue.png"
                alt="TikTok icon"
                class="contact-icon"
              >

              <div>
                <h3>Follow Us on TikTok</h3>

                <a
                  href="https://www.tiktok.com/@t_coudeph"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  @t_coudeph
                </a>
              </div>

            </div>

          </div>

          <!-- TOUCAN IMAGE -->
          <img
            src="images/toucan-photo.png"
            alt="T-Coude toucan illustration"
            class="contact-toucan"
          >

        </section>

        <!-- CONTACT FORM -->
        <section class="contact-form">

          <h2>Send Us a Message</h2>

          <form id="contactForm">

            <label for="contactName">Name</label>

            <input
              type="text"
              class="form-control"
              id="contactName"
              placeholder="Enter your name"
              required
            >

            <label for="contactEmail">Email Address</label>

            <input
              type="email"
              class="form-control"
              id="contactEmail"
              placeholder="Enter your email"
              required
            >

            <label for="contactSubject">Subject</label>

            <select
              class="form-select"
              id="contactSubject"
              required
            >
              <option value="" selected disabled>Select a subject</option>
              <option value="Product Inquiry">Product Inquiry</option>
              <option value="Order Concern">Order Concern</option>
              <option value="General Question">General Question</option>
              <option value="Other">Other</option>
            </select>

            <label for="contactMessage">Message</label>

            <textarea
              class="form-control"
              id="contactMessage"
              rows="5"
              placeholder="Write your message here..."
              required
            ></textarea>

            <button type="submit" class="contact-submit">
              SEND MESSAGE
            </button>

          </form>

        </section>

      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="site-footer">

    <div class="container text-center">

      <img
        src="images/tcoude-footer-logo.png"
        alt="T-Coude Footer Logo"
        height="65"
      >

      <p>
        <a href="privacy.html">Privacy Policy</a>
      </p>

      <p>&copy; 2026 T-Coude. All Rights Reserved.</p>

    </div>

  </footer>

  <!-- JAVASCRIPT -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>

</body>
</html>
