
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do Good Work Tee | T-Coude</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Imbue:wght@400;500;600;700&family=Josefin+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/product.css">
</head>

<body>
<header>
  <nav class="navbar navbar-expand-lg tc-navbar">
    <div class="container">
      <a class="navbar-brand tc-logo" href="index.html">
        <img src="images/tcoude-logo.png" alt="T-Coude logo">
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#mainNavigation" aria-controls="mainNavigation"
        aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavigation">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#products">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#about">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<main class="product-main">
  <section class="product-detail container">
    <div class="product-gallery">
      <button class="gallery-arrow" type="button" id="previousImage" aria-label="Show previous image">&lt;</button>

      <img
        id="productGalleryImage"
        class="solo-product-image"
        src="images/do-good-work-front.png"
        data-front="images/do-good-work-front.png"
        data-back="images/do-good-work-back.png"
        alt="Do Good Work T-shirt, front view">

      <button class="gallery-arrow" type="button" id="nextImage" aria-label="Show next image">&gt;</button>
    </div>

    <div class="product-information">
      <h1>Do Good Work Tee</h1>
      <p class="product-price">₱499</p>
      <p class="product-description">
        A simple statement for people who believe good work speaks for itself.
      </p>

      <hr class="product-divider">

      <form class="order-form" data-product="Do Good Work Tee">
        <h2>Pick Your Size</h2>
        <div class="size-options" role="group" aria-label="Choose a size">
          <label><input type="radio" name="size" value="XS" required><span>XS</span></label>
          <label><input type="radio" name="size" value="S"><span>S</span></label>
          <label><input type="radio" name="size" value="M"><span>M</span></label>
          <label><input type="radio" name="size" value="L"><span>L</span></label>
          <label><input type="radio" name="size" value="XL"><span>XL</span></label>
        </div>

        <h2 class="quantity-heading">Quantity</h2>
        <div class="quantity-control">
          <button type="button" class="quantity-minus" aria-label="Decrease quantity">−</button>
          <input type="number" name="quantity" value="1" min="1" max="99" aria-label="Quantity">
          <button type="button" class="quantity-plus" aria-label="Increase quantity">+</button>
        </div>

        <button type="submit" class="btn order-button">Order Now</button>
      </form>
    </div>
  </section>
</main>

<footer class="tc-footer">
  <div class="container">
    <div class="row align-items-center text-center g-3">
      <div class="col-12 col-md-3">
        <a class="footer-logo" href="index.html" aria-label="T-Coude homepage">
          <img src="images/tcoude-footer-logo.png" alt="T-Coude logo">
        </a>
      </div>
      <div class="col-12 col-md-6 footer-middle">
        <a href="privacy.html">Privacy Policy</a>
        <p>© 2026 T-Coude. All Rights Reserved.</p>
      </div>
      <div class="col-12 col-md-3 footer-socials">
        <a href="#" aria-label="Facebook"><img src="images/facebook.png" alt="Facebook"></a>
        <a href="#" aria-label="TikTok"><img src="images/tiktok.png" alt="TikTok"></a>
        <a href="#" aria-label="Instagram"><img src="images/instagram.png" alt="Instagram"></a>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/order.js"></script>
</body>
</html>
